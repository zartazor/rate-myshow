{% extends 'base.html' %}

{% block title %}Rate {{ title.title }} - RateMyShow{% endblock %}

{% block content %}
<h1>Rate {{ title.title }}</h1>
<form method="post" class="form">
    {% csrf_token %}
    <div class="field">
        <label for="score-input">Score</label>
        <div class="star-rating" role="radiogroup" aria-label="Rating">
            <input type="radio" id="score-10" name="score" value="10" {% if form.score.value|stringformat:"s" == "10" %}checked{% endif %} />
            <label for="score-10" aria-label="Rate 10 out of 10">★</label>
            <input type="radio" id="score-9" name="score" value="9" {% if form.score.value|stringformat:"s" == "9" %}checked{% endif %} />
            <label for="score-9" aria-label="Rate 9 out of 10">★</label>
            <input type="radio" id="score-8" name="score" value="8" {% if form.score.value|stringformat:"s" == "8" %}checked{% endif %} />
            <label for="score-8" aria-label="Rate 8 out of 10">★</label>
            <input type="radio" id="score-7" name="score" value="7" {% if form.score.value|stringformat:"s" == "7" %}checked{% endif %} />
            <label for="score-7" aria-label="Rate 7 out of 10">★</label>
            <input type="radio" id="score-6" name="score" value="6" {% if form.score.value|stringformat:"s" == "6" %}checked{% endif %} />
            <label for="score-6" aria-label="Rate 6 out of 10">★</label>
            <input type="radio" id="score-5" name="score" value="5" {% if form.score.value|stringformat:"s" == "5" %}checked{% endif %} />
            <label for="score-5" aria-label="Rate 5 out of 10">★</label>
            <input type="radio" id="score-4" name="score" value="4" {% if form.score.value|stringformat:"s" == "4" %}checked{% endif %} />
            <label for="score-4" aria-label="Rate 4 out of 10">★</label>
            <input type="radio" id="score-3" name="score" value="3" {% if form.score.value|stringformat:"s" == "3" %}checked{% endif %} />
            <label for="score-3" aria-label="Rate 3 out of 10">★</label>
            <input type="radio" id="score-2" name="score" value="2" {% if form.score.value|stringformat:"s" == "2" %}checked{% endif %} />
            <label for="score-2" aria-label="Rate 2 out of 10">★</label>
            <input type="radio" id="score-1" name="score" value="1" {% if form.score.value|stringformat:"s" == "1" %}checked{% endif %} />
            <label for="score-1" aria-label="Rate 1 out of 10">★</label>
        </div>
        <p id="score-display" class="muted"></p>
    </div>
    <div class="field">
        {{ form.review_text.label_tag }}
        {{ form.review_text }}
    </div>
    <div class="field">
        {{ form.spoiler }} {{ form.spoiler.label_tag }}
    </div>
    <button class="btn" type="submit">Submit Rating</button>
</form>
{% endblock %}
