{% extends 'account/base.html' %}

{% block title %}Sign In - RateMyShow{% endblock %}

{% block auth_content %}
<h1>Sign In</h1>
<p class="muted">Welcome back. Log in to rate and review.</p>
<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
    {% endif %}
    <button class="btn" type="submit">Sign In</button>
</form>
<p class="muted">No account? <a href="{% url 'account_signup' %}">Sign up</a></p>
<p class="muted"><a href="{% url 'account_reset_password' %}">Forgot your password?</a></p>
{% endblock %}
