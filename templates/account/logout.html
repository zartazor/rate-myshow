{% extends 'account/base.html' %}

{% block title %}Sign Out - RateMyShow{% endblock %}

{% block auth_content %}

<p class="muted">Are you sure you want to sign out?</p>
<form method="post" class="form">
    {% csrf_token %}

</form>
{% endblock %}
