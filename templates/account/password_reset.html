{% extends 'account/base.html' %}

{% block title %}Reset Password - RateMyShow{% endblock %}

{% block auth_content %}
<h1>Reset Password</h1>
<p class="muted">Enter your email and we'll send reset instructions.</p>
<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Send Reset Email</button>
</form>
{% endblock %}
