{% extends 'base.html' %}

{% block title %}Profile - RateMyShow{% endblock %}

{% block content %}
<h1>Profile</h1>
<div class="profile">
    <div class="profile-summary">
        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>Watched:</strong> {{ watched_count }}</p>
        <p><strong>Ratings:</strong> {{ ratings_count }}</p>
    </div>
    <form method="post" enctype="multipart/form-data" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Update Profile</button>
    </form>
</div>
{% endblock %}
