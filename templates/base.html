{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RateMyShow - rate movies and TV shows, track your watchlist, and get personalized recommendations." />
    <title>{% block title %}RateMyShow{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
</head>
<body>
    <header class="site-header">
        <div class="container nav">
            <a class="logo" href="{% url 'home' %}">RateMyShow</a>
            <div class="search">
                <input id="search-input" type="search" placeholder="Search movies, TV, actors..." autocomplete="off" />
                <div id="search-results" class="search-results"></div>
            </div>
            <nav class="nav-links">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'activity' %}">Activity</a>
                <a href="{% url 'top_movies' %}">Top Movies</a>
                <a href="{% url 'top_tv' %}">Top TV</a>
                <a href="{% url 'genres' %}">Genres</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'watchlist' %}">Watchlist</a>
                    <a href="{% url 'profile' %}">Profile</a>
                    <a href="{% url 'account_logout' %}">Logout</a>
                {% else %}
                    <a href="{% url 'account_login' %}">Login</a>
                    <a href="{% url 'account_signup' %}">Sign up</a>
                {% endif %}
                <button id="theme-toggle" class="ghost-btn" type="button">Toggle Theme</button>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Built with Django + OMDB API</p>
        </div>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
